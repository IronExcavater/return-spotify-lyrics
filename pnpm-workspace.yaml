packages:
    - apps/*
    - packages/*
allowBuilds:
    esbuild: true
# Security floors for transitive packages. Remove each one when its parent package depends on a fixed version.
overrides:
    adm-zip@<0.6.1: ^0.6.1
    brace-expansion@<1.1.21: ^1.1.21
    brace-expansion@>=4 <5.0.12: ^5.0.12
    fast-uri@>=3 <3.1.9: ^3.1.9
    node-forge@<1.4.3: ^1.4.3
    shell-quote@<1.11.0: ^1.11.0
    source-map-js@<1.2.2: ^1.2.2
    undici@>=7 <7.30.1: ^7.30.1
