name: Bug report
description: Tell us about something that does not work as it should.
title: 'bug: '
labels: [bug]
body:
    - type: textarea
      id: actual
      attributes:
          label: What happens
          description: What you see. Add a screenshot or a recording if it helps.
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: What should happen
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps
          description: The smallest set of steps that makes it happen.
          placeholder: |
              1. Open the popup.
              2. ...
      validations:
          required: true
    - type: dropdown
      id: browsers
      attributes:
          label: Browsers
          multiple: true
          options: [Chrome, Edge, Firefox, Opera, Safari]
      validations:
          required: true
    - type: dropdown
      id: surfaces
      attributes:
          label: Surfaces
          multiple: true
          options: [Popup, Side panel]
    - type: dropdown
      id: account
      attributes:
          label: Spotify account
          description: Some controls need Spotify Premium.
          options: [Free, Premium]
    - type: input
      id: version
      attributes:
          label: Extension version
          description: You can find it on your browser's extensions page.
