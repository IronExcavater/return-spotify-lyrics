name: Feature request
description: Ask for something new, or for a change to something that exists.
title: 'feat: '
labels: [enhancement]
body:
    - type: textarea
      id: goal
      attributes:
          label: What do you want to do?
          description: Describe what you want to do, not how the extension should do it.
      validations:
          required: true
    - type: textarea
      id: now
      attributes:
          label: What do you do now?
          description: How you do it today, or what stops you.
    - type: textarea
      id: notes
      attributes:
          label: Anything else
          description: Screenshots, sketches, or another app that does it well.
