name: Verify

on:
    push:
        branches:
            - main
            - rewrite/wxt-foundation
    pull_request:

concurrency:
    group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Canonicalize workspace
              run: pnpm format:fix

            - name: Check
              id: check
              continue-on-error: true
              run: |
                  set -o pipefail
                  pnpm check 2>&1 | tee /tmp/check.log

            - name: Test
              id: test
              continue-on-error: true
              run: |
                  set -o pipefail
                  pnpm test 2>&1 | tee /tmp/test.log

            - name: Build workspace
              id: build
              continue-on-error: true
              run: |
                  set -o pipefail
                  pnpm build 2>&1 | tee /tmp/build.log

            - name: Verify workspace outputs
              id: outputs
              continue-on-error: true
              run: |
                  test -f apps/extension/.output/chrome-mv3/popup.html
                  test -f apps/extension/.output/chrome-mv3/sidepanel.html
                  test -f apps/extension/.output/chrome-mv3/background.js
                  test -f apps/extension/.output/chrome-mv3/manifest.json
                  test -f apps/storybook/storybook-static/index.html
                  test -f apps/site/dist/index.html

            - name: Build and verify browser targets
              id: browsers
              continue-on-error: true
              run: |
                  set -o pipefail
                  pnpm build:extension:browsers 2>&1 | tee /tmp/browsers.log
                  pnpm verify:extension:browsers 2>&1 | tee -a /tmp/browsers.log

            - name: Record controlled verification
              if: always() && github.ref == 'refs/heads/rewrite/wxt-foundation'
              run: |
                  {
                      echo "commit=${GITHUB_SHA}"
                      echo "check=${{ steps.check.outcome }}"
                      echo "test=${{ steps.test.outcome }}"
                      echo "build=${{ steps.build.outcome }}"
                      echo "outputs=${{ steps.outputs.outcome }}"
                      echo "browsers=${{ steps.browsers.outcome }}"
                      for log in check test build browsers; do
                          echo
                          echo "--- ${log} (tail) ---"
                          tail -n 100 "/tmp/${log}.log" 2>/dev/null || true
                      done
                  } > .github/verification-report.txt
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  if ! git diff --cached --quiet; then
                      git commit -m "chore: sync cross-browser verification [skip ci]"
                      git push
                  fi

            - name: Enforce verification result
              if: >-
                  steps.check.outcome != 'success' ||
                  steps.test.outcome != 'success' ||
                  steps.build.outcome != 'success' ||
                  steps.outputs.outcome != 'success' ||
                  steps.browsers.outcome != 'success'
              run: exit 1
