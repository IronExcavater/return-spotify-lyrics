name: Verify

on:
    push:
        branches:
            - main
            - rewrite/wxt-foundation
    pull_request:

concurrency:
    group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10
                  run_install: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Canonicalize workspace
              if: github.event_name == 'push' && github.ref == 'refs/heads/rewrite/wxt-foundation'
              run: |
                  pnpm format:fix
                  if ! git diff --quiet; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git add .
                      git commit -m "chore: sync workspace lockfile and formatting"
                      git push
                  fi

            - name: Check
              run: pnpm check

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Verify workspace outputs
              run: |
                  test -f apps/extension/.output/chrome-mv3/popup.html
                  test -f apps/extension/.output/chrome-mv3/sidepanel.html
                  test -f apps/extension/.output/chrome-mv3/background.js
                  test -f apps/extension/.output/chrome-mv3/manifest.json
                  test -f apps/storybook/storybook-static/index.html
                  test -f apps/site/dist/index.html
