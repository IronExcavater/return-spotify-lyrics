name: Verify

on:
    push:
    pull_request:

permissions:
    contents: write

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10
                  run_install: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Format once
              if: github.event_name == 'push'
              run: |
                  pnpm format:fix
                  if ! git diff --quiet; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git add .
                      git commit -m "style: format foundation files"
                      git push
                  fi

            - name: Check
              run: pnpm check

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Verify extension outputs
              run: |
                  test -f .output/chrome-mv3/popup.html
                  test -f .output/chrome-mv3/sidepanel.html
                  test -f .output/chrome-mv3/background.js
                  test -f .output/chrome-mv3/manifest.json
